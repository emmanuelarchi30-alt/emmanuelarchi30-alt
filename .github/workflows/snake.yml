name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # se actualiza cada 12 horas
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generar snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: emmanuelarchi30-alt
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake.svg

      - name: Subir a la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
